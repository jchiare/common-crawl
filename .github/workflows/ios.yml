name: iOS

# macOS runners are billed at a higher rate, so this only runs when the app changes.
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]

# A newer push replaces a build that is still running.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Pick a simulator
        run: |
          device=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+[^(]*' | head -1 | sed 's/ *$//')
          echo "Using simulator: $device"
          echo "DESTINATION=platform=iOS Simulator,name=$device" >> "$GITHUB_ENV"
      - name: Compile the app and tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project HomePractice.xcodeproj \
            -scheme HomePractice \
            -destination "$DESTINATION" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|\*\* " || true
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" build.log
      - name: Run unit tests on the simulator
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project HomePractice.xcodeproj \
            -scheme HomePractice \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "error:|Test Case|Executed|\*\* " || true
          grep -q "\*\* TEST EXECUTE SUCCEEDED \*\*" test.log
      - name: Upload the full logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            ios/build.log
            ios/test.log

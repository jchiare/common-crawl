[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-job-atlas"
version = "0.1.0"
description = "Pipeline that mines Common Crawl for Forward Deployed Engineer job postings with semantic search"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<6",
    "warcio>=1.7,<2",
    "sentence-transformers>=3.0,<4",
    "faiss-cpu>=1.8,<2",
    "scikit-learn>=1.4,<2",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "pydantic>=2.5,<3",
    "click>=8.1,<9",
    "tqdm>=4.66,<5",
    "datasketch>=1.6,<2",
    "orjson>=3.9,<4",
    "tenacity>=8.2,<10",
    "boto3>=1.34,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "ruff>=0.3,<1",
    "mypy>=1.8,<2",
]

[project.scripts]
fde-atlas = "fde_job_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
